name: CI

on:
  push:
    branches: [main, kanban]
  pull_request:
    branches: [main, kanban]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Run tests
        run: pnpm test
